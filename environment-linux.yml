name: dl

channels:
  - pytorch
  - conda-forge

dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.11

  # ── Core data science ─────────────────────────────────────────────────────
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scipy

  # ── Deep learning (CPU) ───────────────────────────────────────────────────
  # Remove cpuonly and change to pytorch-cuda=12.1 if the node has a GPU
  - pytorch::pytorch=2.11.0
  - pytorch::torchaudio=2.11.0
  - pytorch::torchvision=0.26.0
  - pytorch::cpuonly

  # ── Hugging Face stack ────────────────────────────────────────────────────
  # pyarrow is left unpinned so conda-forge resolves the correct CPU build.
  # Pinning to =23.0.1 caused a __cuda conflict on CPU-only nodes.
  - conda-forge::pyarrow
  - conda-forge::datasets
  - conda-forge::evaluate
  - conda-forge::transformers
  - conda-forge::tokenizers
  - conda-forge::safetensors
  - conda-forge::huggingface_hub

  # ── Tuning & utilities ────────────────────────────────────────────────────
  - conda-forge::optuna
  - conda-forge::sqlalchemy
  - conda-forge::tqdm
  - conda-forge::requests
  - conda-forge::filelock
  - conda-forge::pyyaml
  - conda-forge::packaging
  - conda-forge::regex
  - conda-forge::xxhash
  - conda-forge::multiprocess
  - conda-forge::dill
  - conda-forge::fsspec
  - conda-forge::aiohttp

  # ── Jupyter (comment out if running fully headless) ───────────────────────
  - conda-forge::jupyterlab
  - conda-forge::ipykernel
  - conda-forge::ipywidgets
  - conda-forge::notebook

  # ── Pip-only ──────────────────────────────────────────────────────────────
  - pip
  - pip:
    - alembic
